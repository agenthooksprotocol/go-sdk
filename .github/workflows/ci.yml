name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-sdk
    steps:
      - uses: actions/checkout@v5
        with:
          path: go-sdk
      - name: Check out canonical interoperability fixtures
        uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/agent-hooks-protocol
          ref: 8f91ac41c335cb29bdb40be205c46ab8b893e035
          path: agent-hooks-protocol
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: go-sdk/go.sum
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check generated artifacts
        run: python3 ../agent-hooks-protocol/tools/generate_sdk.py --go-sdk . --check
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
