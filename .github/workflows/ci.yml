name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-sdk
    steps:
      - uses: actions/checkout@v5
        with:
          path: go-sdk
      - name: Check out canonical interoperability fixtures
        uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/agent-hooks-protocol
          ref: 1d98c19bf4558d998ef8af32b2ac54f604899c20
          path: agent-hooks-protocol
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: go-sdk/go.sum
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check generated artifacts
        run: python3 ../agent-hooks-protocol/tools/generate_sdk.py --go-sdk . --check
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
